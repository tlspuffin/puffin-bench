<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Ordonnanceur Dashboard</h1>
            <div class="controls">
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="loadFileBtn" class="btn btn-primary">Charger fichier JSON</button>
                <button id="refreshBtn" class="btn btn-secondary">Actualiser</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Tâches en cours</h3>
                <div class="stat-value" id="runningSteps">0</div>
            </div>
            <div class="stat-card">
                <h3>Tasks distinctes</h3>
                <div class="stat-value" id="distinctTasks">0</div>
            </div>
            <div class="stat-card">
                <h3>CPU cores utilisés</h3>
                <div class="stat-value" id="totalCores">0</div>
            </div>
            <div class="stat-card">
                <h3>Étapes Build</h3>
                <div class="stat-value" id="buildSteps">0</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="panel">
                <h2>Tâches par état</h2>
                <div class="task-overview" id="taskOverview">
                    <div class="status-item">
                        <span class="status-dot running"></span>
                        <span>Running: <span id="runningCount">0</span></span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Commits en cours</h2>
                <div id="commitList" class="commit-list">
                    <!-- Commits will be populated here -->
                </div>
            </div>
        </div>

        <div class="panel full-width">
            <h2>Étapes en cours d'exécution</h2>
            <div class="table-container">
                <table id="stepsTable" class="steps-table">
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>Step</th>
                            <th>ID</th>
                            <th>Commit</th>
                            <th>Fonction</th>
                            <th>PID</th>
                            <th>CPU cores</th>
                            <th>État</th>
                            <th>Durée</th>
                            <th>Retry</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Steps will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel full-width">
            <h2>Détails des tâches</h2>
            <div id="taskDetails" class="task-details">
                <!-- Task details will be populated here -->
            </div>
        </div>
    </div>

    <div id="errorMessage" class="error-message" style="display: none;">
        <span id="errorText"></span>
        <button onclick="hideError()" class="btn btn-small">✕</button>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
