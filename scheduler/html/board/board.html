<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment Manager</title>
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="taskcard.css">
</head>
<body class="board-page">
  <div class="header">
    <div class="header-top">
      <h1 id="header-title"></h1>
      <div class="stats-bar">
        <div class="stat" data-help="board.counters">
          <span class="stat-label">Running</span>
          <span class="stat-value running" id="running-count">0</span>
        </div>
        <div class="stat" data-help="board.counters">
          <span class="stat-label">Queued</span>
          <span class="stat-value queued" id="queued-count">0</span>
        </div>
        <div class="stat" data-help="board.done12">
          <span class="stat-label">Done &lt; 12 h</span>
          <span class="stat-value done" id="done12-count">–</span>
        </div>
        <div class="stat" data-help="board.done">
          <span class="stat-label">Done</span>
          <span class="stat-value done" id="done-count">–</span>
        </div>
        <div class="stat" data-help="board.lastupdate">
          <span class="stat-label">Last update</span>
          <span class="stat-value lastupdate" id="last-update">N/A</span>
        </div>
      </div>
      <div id="executors-stats" class="executors-stats"></div>
      <div class="header-actions">
        <span class="fold-group">
          <button class="refresh-button" id="fold-button" data-help="board.fold">⊟ Fold</button>
          <button class="refresh-button" id="unfold-active-button" data-help="board.foldactive">▶ Active</button>
          <button class="refresh-button" id="unfold-button" data-help="board.unfold">⊞ Unfold</button>
        </span>
        <div id="custom_header"></div>
      </div>
    </div>
  </div>

  <div id="container-running-steps" class="container-running-steps"></div>

  <div id="exec-tooltip" class="exec-tooltip"></div>

  <template id="help-panel">
    <h2>What is shown</h2>
    <p>Every task that still has running or pending steps, in one row: running tasks first, then the ones waiting for cores, then the scheduled ones (highest priority first within each). Scroll the row horizontally; each task scrolls vertically.</p>
    <p>The strip at the top of a task shows its state (<b>▶ RUNNING</b>, <b>⏸ WAITING FOR CORES</b>, <b>⏳ SCHEDULED</b> with its estimated start), its finished steps and its estimated end. <b>⊟ Fold</b> / <b>⊞ Unfold</b> fold or unfold the steps of every task; <b>▶ Active</b> unfolds only the steps that run an attempt (the board opens this way).</p>
    <p>The page does not refresh on its own: use <b>🔄</b> in the top bar. <b>Last update</b> shows the time of the last refresh.</p>

    <h2>Counters</h2>
    <p>The counters count <b>tasks</b>: <b>Running</b> (with a step running), <b>Queued</b> (waiting for cores or
      scheduled), <b>Done &lt; 12 h</b> (finished or cancelled in the last 12 hours) and <b>Done</b> (all finished
      tasks still in the History). The hover gives the steps behind Running and Queued.</p>

    <h2>Step states</h2>
    <ul>
      <li><span style="color:#FF9800">■</span> Pending: waiting for free cores, with its estimated start time</li>
      <li><span style="color:white">■</span> Running</li>
      <li><span style="color:#4CAF50">■</span> Done</li>
      <li><span style="color:#45D0D4">■</span> Timed out</li>
      <li><span style="color:red">■</span> Cancelled</li>
      <li>A task with a red background is being cancelled</li>
    </ul>

    <h2>Executors</h2>
    <ul>
      <li>CPU, MEM and storage bars show each executor's load</li>
      <li><span style="color:#FF9800">■</span> above 50%, <span style="color:#f44336">■</span> above 80%</li>
      <li>Hover the CPU bar for the load of each core</li>
<li><b>cores 12 / 32</b>: cores used by the steps / their maximum (by default 80 % of the machine's cores, <code>nbCores</code> of the configuration). <b>change max</b>: a temporary maximum for a duration; more cores let more steps start at once, fewer kill nothing (running steps keep their cores, the next ones follow the new maximum); the default comes back at the end (in orange while it lasts).</li>
    </ul>

    <h2>Task actions</h2>
    <p>The <b>...</b> menu of a task changes its priority, cancels it, or starts a new task from the same launcher.</p>

    <h2>New task</h2>
    <p>The <b>+</b> button at the bottom right starts a new task from one of the configured projects (none without a project). A task page (↻ Relaunch as template), and the pages of a project, open the same launcher, pre-filled.</p>

    <h2>A task card</h2>
    <ul>
      <li>Title: as its project describes the task (else its name); a click opens the task page.</li>
      <li>Arguments on one line, as its project shows them (what the title already shows is not repeated, warnings on their own lines).</li>
      <li>One block per step: a square per attempt in its header, one line per configuration, then one line per attempt (cores on hover, duration, exit code, logs).</li>
      <li>Monitor: one line summarizing the last message of the attempt, by its project (else its first line); click for the full message. An attempt its project finds notable is highlighted, and the task may get buttons from its project.</li>
      <li>📋 copies the link to the task page, 📊 opens its published results, <b>...</b> holds the actions.</li>
    </ul>

    <h2>Estimated times</h2>
    <p>Each step is estimated at the median of the last 5 runs of the same step and configuration <b>in the same context</b> (the <code>duration_context</code> of its job, by default its arguments: e.g. the same commit); without 2 of them, the median of the last 15 runs in other contexts that did not time out; runs with the same number of cores first; always capped by the timeout. A running step past its estimate is expected to run to its timeout when that kind of step has timed out before (in its context first), else to end within a minute. A scheduled task starts when enough cores are free for its first step.</p>

    <p>Details: an element with the <span style="cursor:context-menu;text-decoration:underline dotted">box cursor</span> (an arrow with a small box) opens a small window on <b>click</b> (Esc or a click elsewhere closes it); an element with the <span style="cursor:help;text-decoration:underline dotted">? cursor</span>, a link or a button explains itself on <b>hover</b> (after half a second). Press <b>?</b> to toggle this panel.</p>
  </template>

  <script type="module" src="board.js"></script>
</body>
</html>
