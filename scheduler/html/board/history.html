<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Experiment Manager</title>
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="taskcard.css">
</head>
<body>
  <div class="filters">
    <input id="search" class="search" type="search" data-help="history.search"
        placeholder="Search: commit, #PR, message, task name, id, user…">
    <span id="filter-package" class="chips" data-help="history.filter" title="Package of the tasks (its PACKAGE argument; tasks without one: tlspuffin)"></span>
    <span class="sep"></span>
    <span id="filter-users" class="chips" data-help="history.filter"></span>
    <span class="sep"></span>
    <span id="filter-types" class="chips" data-help="history.filter"></span>
    <span class="sep"></span>
    <span id="filter-states" class="chips" data-help="history.filter"></span>
    <span class="sep"></span>
    <label class="sort" data-help="history.sort">Sort by
      <select id="sortIndex-select">
        <option value="end_timestamp" selected>end time</option>
        <option value="id">start time</option>
      </select>
    </label>
    <span class="grow"></span>
    <span id="header-stats" class="header-stats" data-help="history.stats"></span>
  </div>

  <div class="main">
    <div id="list" class="list"></div>
    <div id="drawer" class="drawer" hidden></div>
  </div>

  <template id="help-panel">
    <h2>What is shown</h2>
    <p>Every finished task (done or cancelled) of every user, newest first, grouped by day (of its end or start, see <b>Sort by</b>), with the number of tasks and the core-hours of each day.</p>
    <h2>A task</h2>
    <ul>
      <li>time and duration, type, the task (commit, PR and message when the project describes it), user and id</li>
      <li><b>ok/total</b>: steps that ended well out of all its steps (hover: failed, timed out, cancelled)</li>
      <li>buttons of the task (e.g. 🐞 objectives), 📊 published results, ⬇️ artefacts; dot: <span style="color:#4CAF50">●</span> done, <span style="color:#f44336">●</span> cancelled</li>
    </ul>
    <p>Click a task for its details on the right: actions, times, core-hours, arguments, its configurations and its full task card.</p>
    <h2>Filters</h2>
    <p>The search matches the commit, PR, message, name, id, user, type and package. <b>all | tlspuffin | sshpuffin</b>: the package of the tasks (read from each task, kept by the browser; a task without one is tlspuffin). Chips filter users, types and states; with none selected in a group, the group does not filter. <b>🐞 with objectives</b>: the tasks with an objectives page.</p>
    <h2>Deleting a task</h2>
    <p>💣 removes the archived results on this server and asks the publish server to drop its copy. It cannot be undone.</p>
    <h2>Refresh</h2>
    <p>The list is read when the page opens; <b>🔄</b> in the top bar reads it again (tasks finished since, new objectives pages).</p>
    <p>Details: an element with the <span style="cursor:context-menu;text-decoration:underline dotted">box cursor</span> (an arrow with a small box) opens a small window on <b>click</b> (Esc or a click elsewhere closes it); an element with the <span style="cursor:help;text-decoration:underline dotted">? cursor</span>, a link or a button explains itself on <b>hover</b> (after half a second). Press <b>?</b> to toggle this panel.</p>
  </template>

  <script type="module" src="history.js"></script>
</body>
</html>
