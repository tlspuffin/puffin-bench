<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Analysis Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Performance Analysis Dashboard</h1>
      <p>Visualize benchmark results with statistical confidence intervals</p>
    </header>

    <main>
      <!-- Control Panel -->
      <aside class="controls">
        <section class="control-group">
          <h3>1. Select Commit</h3>
          <select id="commit-type" class="select-input">
            <option value="Perf">Perf</option>
            <option value="Vuln">Vuln</option>
          </select>
          <select id="commit-id" class="select-input" disabled>
            <option value="">Loading commits...</option>
          </select>
        </section>

        <section class="control-group">
          <h3>2. Select Subject</h3>
          <select id="subject" class="select-input" disabled>
            <option value="">Select commit first</option>
          </select>
        </section>

        <section class="control-group">
          <h3>3. Configure Runs</h3>
          <div id="runs-container" class="checkbox-grid">
            <label class="checkbox-label">
              <input type="checkbox" class="run-checkbox" value="0" checked>
              <span>Run 0</span>
            </label>
            <!-- Runs will be populated dynamically -->
          </div>
        </section>

        <section class="control-group">
          <h3>4. Select Clients</h3>
          <div id="clients-container" class="checkbox-grid">
            <label class="checkbox-label">
              <input type="checkbox" class="client-checkbox" value="1" checked>
              <span>Client 1</span>
            </label>
            <!-- Clients will be populated dynamically -->
          </div>
        </section>

        <section class="control-group">
          <h3>5. Select Metrics</h3>
          <div id="metrics-container" class="checkbox-list">
            <!-- Metrics will be populated dynamically -->
          </div>
        </section>

        <section class="control-group">
          <h3>6. Aggregation</h3>
          <label class="radio-label">
            <input type="radio" name="aggregate" value="sum" checked>
            <span>Sum (aggregate clients)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="aggregate" value="">
            <span>Individual (separate series)</span>
          </label>
        </section>

        <section class="control-group">
          <h3>7. Time Range</h3>
          <label>Min (ms):
            <input type="number" id="time-min" class="number-input" value="0">
          </label>
          <label>Max (ms):
            <input type="number" id="time-max" class="number-input" value="10000">
          </label>
          <label>Step (ms):
            <input type="number" id="time-step" class="number-input" value="100">
          </label>
        </section>

        <button id="plot-btn" class="btn-primary" disabled>
          📈 Generate Plot
        </button>
      </aside>

      <!-- Chart Area -->
      <section class="chart-area">
        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <p>Loading data...</p>
        </div>
        <div id="chart" class="chart-container"></div>
        <div id="error" class="error hidden"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
