Init () {
  echo "################ Init ################" >&2;
  nb_cpu=$1
  shift
  [ -z "${nb_cpu}" ] && nb_cpu=1
  AddGlobalParam "START_CORE" 0
  AddGlobalParam "CORES_PER_EXPERIMENT" $(( ${nb_cpu} ))
  AddGlobalParam "START_PORT" $(( 6000 ))

  commit=$1
  shift
  [ -z "${commit}" ] && commit="main"
  AddGlobalParam "COMMIT_ID" ${commit}

  #AbortFail git clone https://github.com/tlspuffin/tlspuffin.git ${OUTPATH}/repo || return 1;
  AbortFail cp -apr /home/olivier/Desktop/restsrv/runs/repo ${OUTPATH}/repo || return 1;
  AbortFail cd ${OUTPATH}/repo || return 1;
  AbortFail git checkout "${commit}" || return 1;
  AbortFail git submodule update --init --recursive || return 1;

  AbortFail cp ${INPATH}/shell.nix . || return 1
  AbortFail nix-shell --run true || return 1;

  return 0;
}

Build() {
  shift;
  features=$1;

  [ -z "${COMMIT_ID}" ] && return 1;
  CACHE_ID="tlspuffin-${COMMIT_ID}-${features}"
  cache_ok=1
  if [[ "${COMMIT_ID}" != "main" ]]; then
    binary=$( /home/olivier/Desktop/restsrv/scripts/get_file.sh -q "$CACHE_ID" )
    cache_ok=$?
  fi
  if [[ $cache_ok -ne 0 ]]; then
    AbortFail cp -apr ${OUTPATH}/repo . || return 1;
    AbortFail cd repo || return 1;
    AbortFail cp ${INPATH}/shell.nix . || return 1
    AbortFail nix-shell --run "cargo build --bin tlspuffin --release --features=${features}" || return 1;
    binary=$( realpath ./target/release/tlspuffin )
    AbortFail curl -s -X POST "http://localhost:8080/cache_put" -F "id=$CACHE_ID" -F "path=${binary}" || return 1;
  fi
  AbortFail cp "${binary}" "${OUTPATH}/${CACHE_ID}" || return 1;
}

Experiment () {
  experiment=$1
  features=$2
  additional_args=$3
  binary="${OUTPATH}/tlspuffin-${COMMIT_ID}-${features}"

  core=$(( START_CORE + ( RUN_ID * CORES_PER_EXPERIMENT ) ))
  end_core=$(( core + CORES_PER_EXPERIMENT - 1 ))
  port=$(( START_PORT + RUN_ID ))

  AbortFail cp ${INPATH}/shell.nix . || return 1
  AbortFail nix-shell --run "\"${binary}\" seed" || return 1;
  AbortFail nix-shell --run "\"${binary}\" --cores \"${core}-${end_core}\" --port \"${port}\" ${additional_args} experiment -d \"${experiment}\" -t \"${experiment}\"" || return 1;
}

CleanupUser () {
  echo "CLEAN"
  echo rm -rf git.${sid}
}
