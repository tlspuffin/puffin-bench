<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PUFFIN Bench</title>
    <style>body { background: #000; }</style>
    <script>
      // Landing page: every page of the bench has the navigation bar on top (board/nav.js), so this page only
      // opens one: the scheduler board, or #results, #analyzer, #history (optionally /<package>, e.g. #results/sshpuffin).
      const host = window.location.hostname;
      const [service, pkg = 'tlspuffin'] = window.location.hash.slice(1).split('/');
      const urls = {
        results: `http://${host}:10083/files/${pkg}`,
        analyzer: `http://${host}:10084/files/${pkg}/index.html`,
        history: `http://${host}:10082/files/board/history.html`,
      };
      window.location.replace(urls[service] ?? `http://${host}:10082/files/board/board.html`);
    </script>
  </head>
  <body></body>
</html>
