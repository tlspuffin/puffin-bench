<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment Manager</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <header class="main-header">
      <h1>🧪 Experiment Manager</h1>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="connection-status">Connected</span>
      </div>
    </header>
    
    <nav class="tabs">
      <button class="tab-button active" data-tab="new-task">
        <span class="tab-icon">➕</span>
        New Task
      </button>
      <button class="tab-button" data-tab="running">
        <span class="tab-icon">▶️</span>
        In Progress
        <span class="badge" id="running-count">0</span>
      </button>
      <button class="tab-button" data-tab="completed">
        <span class="tab-icon">✅</span>
        Finished
        <span class="badge" id="completed-count">0</span>
      </button>
    </nav>
    
    <main class="tab-content">

      <div id="new-task" class="tab-panel active">
        <div class="form-card">
          <h2>Create a new task</h2>
          
          <form id="new-task-form" enctype="multipart/form-data">
            <div class="form-group">
              <label for="task-name">
                Task name
                <span class="required">*</span>
              </label>
              <input 
                type="text" 
                id="task-name" 
                name="name" 
                required 
                placeholder="e.g., 24 December experiment"
              >
            </div>
            
            <div class="form-group">
              <label for="git-commit">
                Commit Git
                <button type="button" id="refresh-commits" class="btn-icon" title="Refresh">🔄</button>
              </label>
              <select id="git-commit" name="commit">
                <option value="">Select a commit...</option>
                <option value="main">main (HEAD)</option>
              </select>
              <small class="form-hint">Or enter a specific commit SHA :</small>
              <input 
                type="text" 
                id="git-commit-manual" 
                placeholder="Ex: 3f648f016c84884d6470fc906735bb8c5da7891b"
              >
            </div>
            
            <div class="form-group">
              <label for="config-file">
                Configuration file
                <span class="required">*</span>
              </label>
              <div class="file-input-wrapper">
                <input 
                  type="file" 
                  id="config-file" 
                  name="config" 
                  accept=".json" 
                  required
                >
                <label for="config-file" class="file-label">
                  <span class="file-icon">📄</span>
                  <span class="file-text">Select experiment.json</span>
                </label>
              </div>
            </div>
            
            <div class="form-group">
              <label for="script-file">
                Function script
                <span class="required">*</span>
              </label>
              <div class="file-input-wrapper">
                <input 
                  type="file" 
                  id="script-file" 
                  name="script" 
                  accept=".sh,.conf" 
                  required
                >
                <label for="script-file" class="file-label">
                  <span class="file-icon">📜</span>
                  <span class="file-text">Select campaign.conf</span>
                </label>
              </div>
            </div>
            
            <div class="form-group">
              <label for="additional-files">
                Additional files
                <span class="optional">(optional)</span>
              </label>
              <div class="file-input-wrapper">
                <input 
                type="file" 
                id="additional-files" 
                name="files[]" 
                multiple
                >
                <label for="additional-files" class="file-label">
                  <span class="file-icon">📁</span>
                  <span class="file-text">Select files...</span>
                </label>
              </div>
              <div id="selected-files" class="selected-files"></div>
            </div>
            
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <span class="btn-icon">🚀</span>
                Launch task
              </button>
              <button type="reset" class="btn btn-secondary">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <div id="running" class="tab-panel">
        <div class="tasks-header">
          <h2>Tasks in progress</h2>
          <button id="refresh-running" class="btn btn-small">
            <span class="btn-icon">🔄</span>
            Refresh
          </button>
        </div>
        
        <div id="running-tasks" class="tasks-grid"></div>
        
        <div id="no-running-tasks" class="empty-state" style="display: none;">
          <span class="empty-icon">🔍</span>
          <p>No active task</p>
        </div>
      </div>
      
      <div id="completed" class="tab-panel">
        <div class="tasks-header">
          <h2>Finished tasks</h2>
          <div class="filter-controls">
            <select id="filter-status" class="filter-select">
              <option value="all">All statuses</option>
              <option value="success">✅ Success</option>
              <option value="failed">❌ Failed</option>
              <option value="cancelled">⚠️ Cancelled</option>
            </select>
            <button id="refresh-completed" class="btn btn-small">
              <span class="btn-icon">🔄</span>
              Refresh
            </button>
          </div>
        </div>
        
        <div id="completed-tasks" class="tasks-list"></div>
        
        <div id="no-completed-tasks" class="empty-state" style="display: none;">
          <span class="empty-icon">📋</span>
          <p>No finished tasks</p>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <div id="task-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Détails de l'expérimentation</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
