<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results</title>
  <link rel="stylesheet" href="/html/publisher/summary_PR.css">
  <link rel="stylesheet" href="/html/publisher/summary_PR_graphmetrics.css">
  <link rel="stylesheet" href="/html/publisher/summary_PR_graphoverview.css">
</head>
<body>
  <header>
    <div class="header-top hidden">
      <div class="header-left">
        <h1 id="header-title"></h1>
        <div class="header-info">
          <span id="total-commits"></span>
        </div>
      </div>

      <div class="header-middle">
        <div id="maindevTab" class="tab">Dev / Main</div>
        <div id="prTab" class="tab">PR</div>
        <div id="branchesTab" class="tab">Branches</div>
        <div id="othersTab" class="tab">Others</div>
        <div id="campaignsTab" class="tab">Campaigns</div>
      </div>

      <div class="header-right">
        <button class="refresh-btn" id="overview-graph-btn" onclick="DisplayOverviewGraph()">📊 Overview</button>
        <button class="refresh-btn" id="metrics-graph-btn" onclick="DisplayMetricsGraph()">📊 Métriques</button>
        <div class="refresh-btn-wrapper">
          <button class="refresh-btn" id="refresh-btn" onclick="BtnRefreshData()">🔄 Refresh</button>
          <div id="refresh-infos" class="hidden"></div>
        </div>
      </div>
    </div>

    <div id="filters" class="hidden">
      <div class="filters" id="common-filters">
        <div class="filter-group">
          <label>Filter by status:</label>
          <button class="filter-btn btn active" data-filter="all">All</button>
          <button class="filter-btn btn" data-filter="with-results">📊 With results</button>
          <button class="filter-btn btn" data-filter="success">🟢 Success</button>
          <button class="filter-btn btn" data-filter="mixed">🟡 Mixed</button>
          <button class="filter-btn btn" data-filter="fail">🔴 Fail</button>
          <button class="filter-btn btn" data-filter="no run">⚪ No run</button>
        </div>
        <div class="filter-group filter-flex">
          <div>
            <label>Show types:</label>
            <div id="type-filters" class="type-filters"></div>
          </div>
          <div id="filter-PR-state" class="hidden">
            <label>PR State:</label>
            <button class="btn active" id="pr-state-toggle">Open</button>
          </div>
        </div>
        <div class="search-group">
          <input type="text" id="search-input" placeholder="Search commit..." />
          <button class="clear-search-btn" onclick="ClearSearch('search-input')" title="Clear search">🧹</button>
        </div>
      </div>

      <div class="filters-campaign hidden" id="campaigns-filters">
        <div class="campaign-search-group">
          <div class="combobox">
            <input type="text" id="search-commit-campaign" placeholder="Search commit..." />
            <ul class="combobox-list hidden" id="dl-commit-campaign"></ul>
          </div>
          <button class="clear-search-commit-campaign-btn" onclick="ClearSearch('search-commit-campaign')" title="Clear search">🧹</button>
          <div class="combobox">
            <input type="text" id="search-user-campaign" placeholder="Search user..." autocomplete="off" />
            <ul class="combobox-list hidden" id="dl-user-campaign"></ul>
          </div>
          <button class="clear-search-user-campaign-btn" onclick="ClearSearch('search-user-campaign')" title="Clear search">🧹</button>
          <div class="combobox">
            <input type="text" id="search-campaign-campaign" placeholder="Search campaign..." />
            <ul class="combobox-list hidden" id="dl-campaign-campaign"></ul>
          </div>
          <button class="clear-search-campaing-campaign-btn" onclick="ClearSearch('search-campaign-campaign')" title="Clear search">🧹</button>
        </div>
      </div>
    </div>

  </header>

  <div id="loading">
    <div class="spinner"></div>
    <h1>Loading...</h1>
  </div>

  <div id="maindevCommits" class="hidden"></div>
  <div id="prCommits" class="hidden"></div>
  <div id="branchesCommits" class="hidden"></div>
  <div id="usersCommits" class="hidden"></div>
  <div id="campaignsCommits" class="hidden"></div>

  <script type="module" src="/html/publisher/summary_PR.js"></script>
</body>
</html>
