<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results</title>
  <link rel="stylesheet" href="/html/publisher/summary_PR.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1 id="header-title"></h1>
        <div class="header-info">
          <span id="total-commits">Loading...</span>
        </div>
      </div>
      <div class="header-right">
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
      </div>
    </header>
    
    <div class="filters">
      <div class="filter-group">
        <label>Filter by status:</label>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="with-results">📊 With results</button>
        <button class="filter-btn" data-filter="success">🟢 Success</button>
        <button class="filter-btn" data-filter="mixed">🟡 Mixed</button>
        <button class="filter-btn" data-filter="fail">🔴 Fail</button>
        <button class="filter-btn" data-filter="no run">⚪ No run</button>
      </div>

      <div class="filter-group">
        <label>Show types:</label>
        <div id="type-filters" class="type-filters"></div>
      </div>

      <div class="search-group">
        <input type="text" id="search-input" placeholder="Search commit..." />
        <button class="clear-search-btn" onclick="clearSearch()" title="Clear search">🧹</button>
      </div>
    </div>
    
    <div id="commits-list" class="commits-container">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading commits...</p>
      </div>
    </div>
    
    <div id="no-results" class="no-results" style="display: none;">
      No commit match filters
    </div>
  </div>
  
  <script src="/html/publisher/summary_PR.js"></script>
</body>
</html>
