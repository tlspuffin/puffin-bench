<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results</title>
  <link rel="stylesheet" href="/html/publisher/summary_PR.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1 id="header-title"></h1>
        <div class="header-info">
          <span id="total-commits">Loading...</span>
        </div>
      </div>
      <div class="header-right">
        <button class="refresh-btn" onclick="displayGraph()">📈 Graphs</button>
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
      </div>
    </header>
    
    <div class="filters">
      <div class="filter-group">
        <label>Filter by status:</label>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="with-results">📊 With results</button>
        <button class="filter-btn" data-filter="success">🟢 Success</button>
        <button class="filter-btn" data-filter="mixed">🟡 Mixed</button>
        <button class="filter-btn" data-filter="fail">🔴 Fail</button>
        <button class="filter-btn" data-filter="no run">⚪ No run</button>
      </div>

      <div class="filter-group">
        <label>Show types:</label>
        <div id="type-filters" class="type-filters"></div>
      </div>

      <div class="search-group">
        <input type="text" id="search-input" placeholder="Search commit..." />
        <button class="clear-search-btn" onclick="clearSearch()" title="Clear search">🧹</button>
      </div>
    </div>
    
    <div id="commits-list" class="commits-container">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading commits...</p>
      </div>
    </div>
    
    <div id="no-results" class="no-results" style="display: none;">
      No commit match filters
    </div>
  </div>
  <div id="graph-modal" class="modal">
    <div class="modal-overlay" onclick="closeGraphModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>📈 Metrics Evolution</h2>
        <button class="modal-close" onclick="closeGraphModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="graph-controls">
          <div class="control-group">
            <label for="type-select">Type:</label>
            <select id="type-select" onchange="updateMetricsList()">
              <option value="">Select type...</option>
            </select>
          </div>
          <div class="control-group">
            <label for="library-select">Library:</label>
            <select id="library-select" onchange="updateMetricsList()">
              <option value="">Select library...</option>
            </select>
          </div>
          <div class="control-group">
            <label for="metric-select">Metric:</label>
            <select id="metric-select" onchange="renderGraph()">
              <option value="">Select metric...</option>
            </select>
          </div>
        </div>
        <div id="graph-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/html/publisher/summary_PR.js"></script>
</body>
</html>
