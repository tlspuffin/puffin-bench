<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUFFIN Bench</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <iframe id="content" name="main"></iframe>
    <div id="navigation">
      <div class="navheader">Navigation ▲</div>
      <div id="navitems"></div>
    </div>
  </body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const hostname = window.location.hostname;
        const services = [
          { url: `http://${hostname}:10081/files/board/board.html`, label: '🗓️ Scheduler' },
          { url: `http://${hostname}:10082/files/tlspuffin`, label: '🗂️ Experiment results', default: null },
          { url: `http://${hostname}:10084/files/vis_comparator/index.html`, label: '🔬 Experiment analyzer' },
        ];
        const rootDiv = document.getElementById('navitems');
        const iframe = document.getElementById('content');
        const links = [];
        services.forEach(link => {
            const href = document.createElement('a');
            href.target = 'main';
            href.href = link.url;
            href.innerText = link.label;
            href.onclick = (event) => {
                links.forEach(link => link.classList.remove('active'));
                href.classList.add('active');
            };
            links.push(href);
            const div = document.createElement('div');
            div.className = 'navitem';
            div.appendChild(href);
            rootDiv.appendChild(div);
            if (Object.hasOwn(link, 'default') && iframe) {
              iframe.src = link.url;
              href.classList.add('active');
            }
        });
    });
  </script>
</html>
